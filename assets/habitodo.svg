<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181d" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" stroke="#262930" stroke-width="4" filter="url(#shadow)" />

  <!-- Outer Ambient Progress Glow -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#glow)" stroke-width="28" />

  <!-- Background Progress Track -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#22252c" stroke-width="18" stroke-linecap="round" />

  <!-- Active 270-degree Habit Completion Arc -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#ring)" stroke-width="18"
          stroke-linecap="round" stroke-dasharray="697 930" stroke-dashoffset="0"
          transform="rotate(-90 256 256)" />

  <!-- Central Bold Checkmark -->
  <path d="M 188 262 L 234 308 L 332 206"
        fill="none" stroke="#4ade80" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cyan Focus Sparkle / Streak Dot -->
  <circle cx="360" cy="152" r="14" fill="#38bdf8" />
  <circle cx="360" cy="152" r="24" fill="#38bdf8" opacity="0.25" />
</svg>
